name: HTTPConnectionKit CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: http-connection-kit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Swift 6.4.0, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 26 keeps the HTTP/3 availability checks live.
          - name: macOS
            os: macos-26
          - name: Linux
            os: ubuntu-24.04
    env:
      SWIFT_CERTIFICATES_ALLOW_SWIFT_CRYPTO_BETA: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev zlib1g-dev

      - name: Install Swift 6.4.0 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -O "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz"
          tar zxf "swiftly-$(uname -m).tar.gz"
          ./swiftly init --skip-install --assume-yes --quiet-shell-followup
          # shellcheck disable=SC1091
          source "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
          swiftly install --assume-yes --use 6.4.0
          TOOLCHAIN_BIN=""
          for candidate in "$HOME"/.local/share/swiftly/toolchains/*/usr/bin; do
            if [ -x "$candidate/swift" ]; then
              TOOLCHAIN_BIN=$candidate
              break
            fi
          done
          if [ -z "$TOOLCHAIN_BIN" ]; then
            echo "Swift 6.4.0 toolchain was not installed" >&2
            find "$HOME/.local/share/swiftly" -name swift >&2 || true
            exit 1
          fi
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

      - name: Install Swift 6.4.0 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -O https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          "$HOME/.swiftly/bin/swiftly" init --skip-install --assume-yes --quiet-shell-followup
          # shellcheck disable=SC1091
          source "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"
          swiftly install --assume-yes --use 6.4.0
          TOOLCHAIN_DIR=""
          for candidate in "$HOME"/Library/Developer/Toolchains/swift-6.4*.xctoolchain; do
            if [ -d "$candidate" ]; then
              TOOLCHAIN_DIR=$candidate
              break
            fi
          done
          if [ -z "$TOOLCHAIN_DIR" ]; then
            echo "Swift 6.4.0 toolchain was not installed" >&2
            ls -la "$HOME/Library/Developer/Toolchains" >&2 || true
            exit 1
          fi
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$TOOLCHAIN_DIR/Info.plist")
          echo "TOOLCHAINS=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_DIR/usr/bin" >> "$GITHUB_PATH"

      - name: Require Swift 6.4
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(swift --version 2>&1)
          printf '%s\n' "$VERSION"
          printf '%s\n' "$VERSION" | head -n 1 | grep -E 'Swift version 6\.4'

      - name: Cache Swift package build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swift-6.4.0-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swift-6.4.0-

      - name: Test
        run: swift test

  android:
    name: Test (Android, Swift 6.4.0)
    # macos-26 is arm64. Those runners cannot boot an Android emulator (HV_UNSUPPORTED).
    # macos-15-intel can, so the test binary targets the x86_64 emulator ABI.
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      SWIFT_CERTIFICATES_ALLOW_SWIFT_CRYPTO_BETA: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Skip.tools
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install skiptools/skip/skip
          skip version

      - name: Install Swiftly 1.2.0
        shell: bash
        run: |
          set -euo pipefail
          SWIFTLY_PKG="$RUNNER_TEMP/swiftly-1.2.0.pkg"
          curl -fsSL https://download.swift.org/swiftly/darwin/swiftly-1.2.0.pkg -o "$SWIFTLY_PKG"
          echo "a1b48692b00ea6902957423473c87bee7c7f3e18c015a4a09317102f6820b987  $SWIFTLY_PKG" | shasum -a 256 --check
          installer -pkg "$SWIFTLY_PKG" -target CurrentUserHomeDirectory
          "$HOME/.swiftly/bin/swiftly" init --assume-yes --no-modify-profile --skip-install
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
          SWIFTLY_VERSION=$("$HOME/.swiftly/bin/swiftly" --version)
          echo "Swiftly $SWIFTLY_VERSION"
          [[ "$SWIFTLY_VERSION" == "1.2.0" ]]

      - name: Install Swift Android SDK
        shell: bash
        run: |
          set -euo pipefail
          # Homebrew's swiftly, pulled in by Skip, requests a swift-6.4-RELEASE
          # URL that does not exist. Swiftly 1.2.0 is the release that fetches 6.4.0.
          export PATH="$HOME/.swiftly/bin:$PATH"
          hash -r
          SWIFTLY_VERSION=$(swiftly --version)
          echo "Using $(command -v swiftly) ($SWIFTLY_VERSION)"
          [[ "$SWIFTLY_VERSION" == "1.2.0" ]]
          printf 'y\n' | skip android sdk install --version 6.4.0 --swift-version 6.4.0

      - name: Install Android SDK and emulator
        shell: bash
        run: |
          set -eu
          export PATH="$HOME/.swiftly/bin:$PATH"
          echo "ANDROID_HOME=$HOME/Library/Android/sdk" >> "$GITHUB_ENV"
          echo "$HOME/Library/Android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$HOME/Library/Android/sdk/emulator" >> "$GITHUB_PATH"
          printf 'y\n%.0s' {1..30} | skip android home install --plain
          printf 'y\n%.0s' {1..30} | skip android emulator create --plain --name hck --arch x86_64 --android-api-level 34

      - name: Cache Swift package build
        uses: actions/cache@v4
        with:
          path: .build
          key: android-x86_64-swift-6.4.0-${{ hashFiles('Package.swift') }}
          restore-keys: |
            android-x86_64-swift-6.4.0-

      - name: Test on Android
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.swiftly/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd hck \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -accel on \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          deadline=$((SECONDS + 240))
          until adb devices | grep -q 'emulator-'; do
            if (( SECONDS > deadline )); then
              echo "emulator did not register with adb" >&2
              tail -n 200 "$RUNNER_TEMP/emulator.log" >&2 || true
              exit 1
            fi
            sleep 2
          done
          until adb shell getprop sys.boot_completed | grep -q 1; do
            if (( SECONDS > deadline )); then
              echo "emulator did not finish booting" >&2
              tail -n 200 "$RUNNER_TEMP/emulator.log" >&2 || true
              exit 1
            fi
            sleep 2
          done
          skip android test --plain --swift-version 6.4.0 --arch x86_64 --android-connect-timeout 60
